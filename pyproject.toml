[project]
name = "autobahntestsuite"
version = "25.10.1"
description = "AutobahnTestSuite - WebSocket protocol implementation conformance test suite"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "typedef int GmbH" }]
requires-python = ">=3.12"
dependencies = [
    "autobahn[twisted]>=26.7.1",
    "twisted>=26.4.0",
    "jinja2>=3.1",
]

[project.urls]
Source = "https://github.com/ricardo-valero/autobahn-testsuite"
Documentation = "https://autobahntestsuite.readthedocs.io"

[project.scripts]
wstest = "autobahntestsuite.wstest:run"

[dependency-groups]
dev = [
    "ty",
]

[tool.uv]
constraint-dependencies = [
    # cbor2 >=6 is Rust-based with no x86_64-macOS wheels; 5.x ships wheels everywhere
    "cbor2<6",
    # cryptography >=49 dropped x86_64-macOS wheels (Rust build required)
    "cryptography<49",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autobahntestsuite/autobahntestsuite"]

[tool.hatch.build.targets.wheel.force-include]
"autobahntestsuite/autobahntestsuite/templates" = "autobahntestsuite/templates"

[tool.ty.src]
include = ["autobahntestsuite/autobahntestsuite"]
