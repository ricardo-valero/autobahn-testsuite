[project]
name = "autobahntestsuite"
version = "25.10.1"
description = "AutobahnTestSuite - WebSocket protocol implementation conformance test suite"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "typedef int GmbH" }]
requires-python = ">=3.12"
dependencies = [
    "autobahn[twisted]>=26.7.1",
    "twisted[tls]>=26.4.0",
    "pyopenssl>=25.0",
    "service-identity>=24.1",
    "jinja2>=3.1",
]

[project.urls]
Source = "https://github.com/ricardo-valero/autobahn-testsuite"
Documentation = "https://autobahntestsuite.readthedocs.io"

[project.scripts]
wstest = "autobahntestsuite.wstest:run"

[project.optional-dependencies]
# Installable as an extra (`pip install .[docs]`) so Read the Docs and uv share
# one source of truth for the Sphinx toolchain.
docs = [
    "sphinx>=8.2",
    "sphinxcontrib-images>=1.0",
    "sphinx-rtd-theme>=3.0",
]

[dependency-groups]
dev = [
    "ty",
]

[tool.uv]
# Latest transitive deps everywhere EXCEPT x86_64-macOS, which lacks wheels for
# cbor2>=6 / cryptography>=49 (Rust source builds). The markers keep that one
# platform on the last wheel-available versions; Linux/CI/Apple Silicon get
# latest. Self-removing once the dev machine is Apple Silicon.
constraint-dependencies = [
    "cbor2<6; platform_machine == 'x86_64' and sys_platform == 'darwin'",
    "cryptography<49; platform_machine == 'x86_64' and sys_platform == 'darwin'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autobahntestsuite/autobahntestsuite"]

[tool.hatch.build.targets.wheel.force-include]
"autobahntestsuite/autobahntestsuite/templates" = "autobahntestsuite/templates"

[tool.ty.src]
include = ["autobahntestsuite/autobahntestsuite"]
