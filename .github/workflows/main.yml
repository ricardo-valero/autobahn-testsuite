name: main

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
  TOOLS_VENV: ${{ github.workspace }}/.venvs/cpy314

jobs:
  # Python 3 port (migrate-python3): install with uv and smoke-test wstest.
  # The former Python 2 `build` job was removed with the py3 migration — the
  # frozen py2 reference is the published Docker image, not master's CI.
  py3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --group dev

      - name: wstest version + help
        run: |
          uv run wstest -a
          uv run wstest --help

      - name: Fuzzing smoke test (sections 1-2 vs echo testee)
        run: uv run python test/differential/smoke_py3.py

      - name: Type check (advisory)
        continue-on-error: true
        run: uv run ty check

  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codeq
        uses: actions/checkout@v4

      - name: Install Just
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to ${HOME}/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install uv
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          source $HOME/.cargo/env
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Verify toolchain installation
        run: |
          which just
          just --version
          which uv
          uv --version

      # # 🧩 Restore cached Python 3 tools venv if available
      # - name: Cache tools environment (venv + uv cache => cache both directories together!)
      #   id: cache-tools-venv
      #   uses: actions/cache@v4
      #   with:
      #     path: |
      #       ${{ env.TOOLS_VENV }}
      #       ${{ env.UV_CACHE_DIR }}
      #     key: tools-venv-${{ runner.os }}-${{ hashFiles('requirements-dev.txt') }}
      #     restore-keys: |
      #       tools-venv-${{ runner.os }}-

      # # 🧱 Create the tools venv only if cache is missing
      # - name: Cache tools environment (using uv) with AutobahnTestsuite tools
      #   if: steps.cache-tools-venv.outputs.cache-hit != 'true'
      #   run: just tools-venv

      # # 🧩 Save tools venv cache after deps installed
      # - name: Save tools environment cache
      #   if: steps.cache-tools-venv.outputs.cache-hit != 'true'
      #   uses: actions/cache/save@v4
      #   with:
      #     path: |
      #       ${{ env.TOOLS_VENV }}
      #       ${{ env.UV_CACHE_DIR }}
      #     key: tools-venv-${{ runner.os }}-${{ hashFiles('requirements-dev.txt') }}

      - name: Create Python 3 venv (using uv) with AutobahnTestsuite tools
        run: just tools-venv

      - name: Build documentation (using Sphinx)
        run: just docs

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: autobahn-testsuite-docs
          path: docs/_build/html/
