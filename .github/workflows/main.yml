name: main

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  # Python 3 port (migrate-python3): install with uv and smoke-test wstest.
  # The former Python 2 `build` job was removed with the py3 migration — the
  # frozen py2 reference is the published Docker image, not master's CI.
  py3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --group dev

      - name: wstest version + help
        run: |
          uv run wstest -a
          uv run wstest --help

      - name: Fuzzing smoke test (sections 1-2 vs echo testee)
        run: uv run python test/differential/smoke_py3.py

      - name: Type check (advisory)
        continue-on-error: true
        run: uv run ty check

  flake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Flake check
        run: nix flake check

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build documentation (Sphinx via the docs extra)
        run: uv run --extra docs sphinx-build -b html docs docs/_build/html

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: autobahn-testsuite-docs
          path: docs/_build/html/
